        Minimized PII — no raw phone; locality not full address until later policy.
        `deliveryOtp` MUST NOT appear on this DTO — riders submit OTP via POST /deliveries/{id}/complete only.
        `dropLat`/`dropLng` included only after pickup (`status=picked_up`) for navigation handoff; omitted before pickup for privacy.
      properties:
        deliveryId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          description: Assignment/delivery milestone (e.g. accepted, picked_up)
        pickupCodeHint:
          type: string
          description: Kitchen pickup code hint — not customer delivery OTP
        dropLocality:
          type: string
        dropLat:
          type: number
          format: double
          nullable: true
          description: Drop coordinates for maps nav; only when status=picked_up
        dropLng:
          type: number
          format: double
          nullable: true
          description: Drop coordinates for maps nav; only when status=picked_up
        customerDisplayName:
          type: string
          description: First name or masked
        packageCount:
          type: integer
        phone:
          type: string
          description: Must be omitted or fully masked — never raw
          nullable: true
