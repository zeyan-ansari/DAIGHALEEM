openapi: 3.0.3
info:
  title: DAIG Haleem API
  version: 0.1.0
  description: |
    Skeleton OpenAPI for DAIG Haleem. Domains expand phase by phase.
    Clients never hold privileged secrets or make authoritative price/state decisions.
servers:
  - url: https://api.daig.local/v1
    description: Local/staging placeholder
tags:
  - name: auth
  - name: users
  - name: addresses
  - name: devices
  - name: outlets
  - name: serviceability
  - name: catalogue
  - name: availability
  - name: slots
  - name: carts
  - name: pricing
  - name: promotions
  - name: orders
  - name: invoices
  - name: payments
  - name: refunds
  - name: webhooks
  - name: riders
  - name: assignments
  - name: deliveries
  - name: location
  - name: earnings
  - name: kitchen
  - name: capacity
  - name: dispatch
  - name: support
  - name: notifications
  - name: tracking
  - name: comms
  - name: admin
  - name: reports
  - name: finance
  - name: analytics
paths:
  /health:
    get:
      security: []
      summary: Liveness/readiness
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/otp/request:
    post:
      security: []
      tags: [auth]
      summary: Request OTP for Indian mobile number
      operationId: requestOtp
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent (or mock accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rateLimited:
                  value:
                    code: AUTH_OTP_RATE_LIMITED
                    message: Too many OTP requests
                    requestId: req_example
  /auth/otp/verify:
    post:
      security: []
      tags: [auth]
      summary: Verify OTP and create session
      operationId: verifyOtp
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  value:
                    code: AUTH_OTP_INVALID
                    message: Invalid or expired OTP
                    requestId: req_example
  /auth/sessions/revoke:
    post:
      tags: [auth]
      summary: Revoke current or specified session
      operationId: revokeSession
      x-phase: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      tags: [users]
      summary: Get current user profile
      operationId: getCurrentUser
      x-phase: 2
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [users]
      summary: Update current user profile
      operationId: patchCurrentUser
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      summary: Schedule account deletion (stub OK for pilot)
      operationId: deleteCurrentUser
      x-phase: 2
      responses:
        "202":
          description: Deletion scheduled
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /devices:
    post:
      tags: [devices]
      summary: Register or refresh a device for push/session binding
      operationId: registerDevice
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegister"
      responses:
        "200":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/roles:
    get:
      tags: [admin]
      summary: List console roles and permissions
      operationId: listAdminRoles
      x-phase: 2
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminRole"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                forbidden:
                  value:
                    code: AUTH_FORBIDDEN
                    message: Insufficient role
                    requestId: req_example
  /admin/users/{userId}/roles:
    put:
      tags: [admin]
      summary: Set console roles for a user
      operationId: setAdminUserRoles
      x-phase: 2
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    $ref: "#/components/schemas/ConsoleRole"
      responses:
        "200":
          description: Roles updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRoles"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /serviceability:
    post:
      security: []
      tags: [serviceability]
      summary: Check lat/lng (or addressId) serviceability
      operationId: checkServiceability
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceabilityRequest"
      responses:
        "200":
          description: Deliverable result with outlet/fees/ETA/slots preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceabilityResult"
        "422":
          description: Out of zone (structured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfZone:
                  value:
                    code: SERVICEABILITY_OUT_OF_ZONE
                    message: Address is outside delivery zones
                    requestId: req_example
  /serviceability/waitlist:
    post:
      security: []
      tags: [serviceability]
      summary: Capture out-of-zone waitlist interest
      operationId: joinServiceabilityWaitlist
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "201":
          description: Waitlist entry saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
  /addresses:
    get:
      tags: [addresses]
      summary: List own saved addresses
      operationId: listAddresses
      x-phase: 4
      responses:
        "200":
          description: Own addresses only
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
    post:
      tags: [addresses]
      summary: Create address (Home/Work/Other)
      operationId: createAddress
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
  /addresses/{addressId}:
    put:
      tags: [addresses]
      summary: Update own address
      operationId: updateAddress
      x-phase: 4
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [addresses]
      summary: Delete own address
      operationId: deleteAddress
      x-phase: 4
      parameters:
        - in: path
          name: addressId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
  /admin/outlets/{outletId}:
    get:
      tags: [admin, outlets]
      summary: Get outlet settings
      operationId: adminGetOutlet
      x-phase: 4
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Outlet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
    put:
      tags: [admin, outlets]
      summary: Upsert outlet hours and defaults
      operationId: adminUpsertOutlet
      x-phase: 4
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletUpsert"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
  /admin/outlets/{outletId}/zones:
    get:
      tags: [admin, outlets]
      summary: List delivery zones for outlet
      operationId: adminListZones
      x-phase: 4
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeliveryZone"
    post:
      tags: [admin, outlets]
      summary: Create delivery zone
      operationId: adminCreateZone
      x-phase: 4
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
  /admin/outlets/{outletId}/zones/{zoneId}:
    put:
      tags: [admin, outlets]
      summary: Update delivery zone
      operationId: adminUpdateZone
      x-phase: 4
      parameters:
        - in: path
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: zoneId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
  /slots:
    get:
      security: []
      tags: [slots]
      summary: List delivery slots with capacity remaining (preview; no reserve)
      operationId: listSlots
      x-phase: 4
      parameters:
        - in: query
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Slots for day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotListResponse"
  /pricing/quote:
    post:
      tags: [pricing]
      summary: Canonical cart quote (deterministic; tip excluded from outlet revenue)
      operationId: quoteCart
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartQuoteRequest"
      responses:
        "200":
          description: Quote with fee lines and priceVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartQuote"
        "409":
          description: Stale price version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /carts/me:
    get:
      tags: [carts]
      summary: Get persisted signed-in cart
      operationId: getCart
      x-phase: 4
      responses:
        "200":
          description: Cart with server quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    put:
      tags: [carts]
      summary: Replace cart lines (add/update/remove via full replace)
      operationId: putCart
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartUpsert"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /carts/me/validate:
    post:
      tags: [carts]
      summary: Validate cart for stock/zone/slot/coupon; returns fees or errors
      operationId: validateCart
      x-phase: 4
      description: |
        Does not create an order. Order create (Phase 05) must send Idempotency-Key.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slotId:
                  type: string
                  format: uuid
                couponCode:
                  type: string
                tipPaise:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartValidationResult"
  /promotions/coupons/validate:
    post:
      tags: [promotions]
      summary: Validate coupon code (stub engine)
      operationId: validateCoupon
      x-phase: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, outletId]
              properties:
                code:
                  type: string
                outletId:
                  type: string
                  format: uuid
                subtotalPaise:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Coupon ok or failure reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponValidationResult"
  /catalogue/products:
    get:
      security: []
      tags: [catalogue]
      summary: List sellable products for outlet
      operationId: listProducts
      x-phase: 3
      parameters:
        - in: query
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Simple name search (case-insensitive contains)
        - in: query
          name: categoryId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product list with live availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /catalogue/products/{productId}:
    get:
      security: []
      tags: [catalogue]
      summary: Product detail with variants, add-ons, allergens, availability
      operationId: getProduct
      x-phase: 3
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /availability:
    get:
      security: []
      tags: [availability]
      summary: Batch/stock availability snapshot for outlet (cacheable)
      operationId: getAvailability
      x-phase: 3
      parameters:
        - in: query
          name: outletId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Availability map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySnapshot"
  /admin/catalogue/products:
    get:
      tags: [admin, catalogue]
      summary: Admin list products (including unpublished)
      operationId: adminListProducts
      x-phase: 3
      responses:
        "200":
          description: Admin product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      tags: [admin, catalogue]
      summary: Create product draft
      operationId: adminCreateProduct
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpsert"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
  /admin/catalogue/products/{productId}:
    put:
      tags: [admin, catalogue]
      summary: Update product
      operationId: adminUpdateProduct
      x-phase: 3
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpsert"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
    post:
      tags: [admin, catalogue]
      summary: Publish or unpublish product
      operationId: adminPublishProduct
      x-phase: 3
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [published]
              properties:
                published:
                  type: boolean
      responses:
        "200":
          description: Publish state updated
  /admin/catalogue/products/{productId}/unavailable:
    post:
      tags: [admin, catalogue]
      summary: Mark product/variant unavailable for a duration
      operationId: adminMarkUnavailable
      x-phase: 3
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkUnavailableRequest"
      responses:
        "200":
          description: Unavailability applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityInfo"
  /admin/inventory/batches:
    post:
      tags: [admin]
      summary: Create or adjust a production batch
      operationId: adminCreateBatch
      x-phase: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpsert"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
  /orders:
    get:
      tags: [orders]
      summary: List own orders (customer)
      operationId: listMyOrders
      x-phase: 5
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
    post:
      tags: [orders]
      summary: Create idempotent order from validated cart
      description: |
        Requires Idempotency-Key. Server re-validates cart, reserves stock/slot,
        snapshots price. paymentStatus=pending until mock/capture webhook.
        orderStatus becomes confirmed only after captured payment (or COD if enabled).
        Duplicate Idempotency-Key returns the same order (200 or 201).
      operationId: createOrder
      x-phase: 5
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created (payment pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: Idempotent replay — same order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Idempotency conflict or stale price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}:
    get:
      tags: [orders, tracking]
      summary: Get own order detail
      description: |
        Phase 08 optional fields on `Order` (customer GET only): `promisedWindow`, `currentEta`,
        `deliveryOtp` (present when active and undelivered; never on rider/dispatch APIs),
        `timelineHint` (lightweight status copy for list cards).
      operationId: getOrder
      x-phase: 5
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: Customer cancel before kitchen accept
      operationId: cancelOrder
      x-phase: 5
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Cancelled; refund lifecycle separate if paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/payment-intent:
    post:
      tags: [payments]
      summary: Create or reuse mock payment intent during hold
      operationId: createPaymentIntent
      x-phase: 5
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                simulate:
                  type: string
                  enum: [success, fail, pending]
                  description: Mock-only outcome hint for local/dev
      responses:
        "200":
          description: Intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /orders/{orderId}/invoice:
    get:
      tags: [invoices]
