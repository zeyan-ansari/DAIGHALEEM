      type: object
      required: [id, outletId, paymentStatus, refundStatus, totalPaise, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        orderStatus:
          allOf:
            - $ref: "#/components/schemas/OrderState"
