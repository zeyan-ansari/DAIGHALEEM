          allOf:
            - $ref: "#/components/schemas/EtaWindow"
          description: Immutable promise set at order confirm; never narrowed retroactively
        currentEta:
          allOf:
            - $ref: "#/components/schemas/EtaWindow"
          nullable: true
          description: Live ETA window; may shift on assign/pickup/location recalc (customer GET only)
