      summary: Get ticket with timeline
      operationId: getSupportTicket
      x-phase: 9
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /support/tickets/{ticketId}/messages:
    post:
      tags: [support]
      summary: Append message to ticket timeline
      operationId: appendSupportTicketMessage
      x-phase: 9
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketMessageRequest"
      responses:
        "201":
          description: Message added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /support/tickets/{ticketId}/resolve:
    post:
      tags: [support, refunds]
      summary: Agent resolves ticket (refund/coupon/deny)
      operationId: resolveSupportTicket
      x-phase: 9
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSupportTicketRequest"
      responses:
        "200":
          description: Resolution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundDecision"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Refund over agent cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: REFUND_LIMIT_EXCEEDED
                message: Refund amount exceeds agent cap
                requestId: req-example
  /orders/{orderId}/issues:
    post:
      tags: [support, orders]
      summary: Report item-level issue (missing/wrong/spill)
      operationId: createOrderIssue
      x-phase: 9
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderIssueRequest"
      responses:
        "201":
          description: Issue recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderIssue"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Outside issue window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/ratings:
    post:
      tags: [orders, support]
      summary: Rate delivered order (food/packaging/delivery)
      operationId: createOrderRating
      x-phase: 9
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRatingRequest"
      responses:
        "201":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRating"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Order not delivered or already rated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /refunds/{decisionId}/execute:
    post:
      tags: [refunds]
      summary: Execute approved refund via mock gateway (idempotent)
      operationId: executeRefund
      x-phase: 9
      parameters:
        - in: path
          name: decisionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Execution result (new or prior)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundExecution"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Decision not refundable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/config/support:
    get:
      tags: [admin, support]
      summary: Support + legal placeholder config
      operationId: getSupportConfig
      x-phase: 9
      responses:
        "200":
          description: Public/support config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConfig"
    put:
      tags: [admin, support]
      summary: Update support wa.me and legal placeholders
      operationId: updateSupportConfig
      x-phase: 9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportConfigPatch"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConfig"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/finance/exceptions/latest:
    get:
      tags: [finance, admin]
      summary: Latest finance exception report
      operationId: getLatestFinanceExceptionReport
      x-phase: 10
      responses:
        "200":
          description: Latest report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceExceptionReport"
        "404":
          description: No report yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerWebhookSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum:
            - AUTH_OTP_INVALID
            - AUTH_OTP_RATE_LIMITED
            - AUTH_SESSION_REVOKED
            - AUTH_FORBIDDEN
            - SERVICEABILITY_OUT_OF_ZONE
            - CATALOGUE_SOLD_OUT
            - CATALOGUE_STALE_PRICE
            - CART_VALIDATION_FAILED
            - COUPON_INVALID
            - COUPON_EXPIRED
            - COUPON_MIN_ORDER
            - SLOT_FULL
            - OUTLET_CLOSED
            - ORDER_IDEMPOTENCY_CONFLICT
            - ORDER_INVALID_TRANSITION
            - PAYMENT_FAILED
            - PAYMENT_PENDING
            - PAYMENT_WEBHOOK_INVALID
            - CAPACITY_EXCEEDED
            - ASSIGNMENT_CONFLICT
            - DELIVERY_OTP_INVALID
            - REFUND_LIMIT_EXCEEDED
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone:
          type: string
          description: E.164 Indian mobile, e.g. +9198XXXXXXXX
          pattern: '^\+91[6-9]\d{9}$'
        purpose:
          type: string
          enum: [customer_login, rider_login, console_login]
        deviceId:
          type: string
    OtpRequestResponse:
      type: object
      required: [requestId, expiresInSeconds, channel]
      properties:
        requestId:
          type: string
        expiresInSeconds:
          type: integer
          example: 300
        channel:
          type: string
          enum: [mock_sms, sms]
          description: mock_sms in non-prod; never return the OTP code in production responses
        retryAfterSeconds:
          type: integer
    OtpVerify:
      type: object
      required: [phone, code, purpose]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        code:
          type: string
          minLength: 4
          maxLength: 8
        purpose:
          type: string
          enum: [customer_login, rider_login, console_login]
        deviceId:
          type: string
    OtpVerifyResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user, sessionId]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresInSeconds:
          type: integer
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [id, phone, roles]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        language:
          type: string
          example: en
        notificationPrefs:
          type: object
          additionalProperties: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleRole"
        mfaRequired:
          type: boolean
          description: Console admins only; when true and unmet, admin APIs return AUTH_FORBIDDEN
        mfaVerified:
          type: boolean
    UserProfilePatch:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        language:
          type: string
        notificationPrefs:
          type: object
          additionalProperties: true
    DeviceRegister:
      type: object
      required: [platform, pushToken]
      properties:
        platform:
          type: string
          enum: [ios, android, web]
        pushToken:
          type: string
        appVersion:
          type: string
        deviceId:
          type: string
    Device:
      type: object
      required: [id, platform]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android, web]
        appVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    ConsoleRole:
      type: string
      enum:
        - customer
        - rider
        - kitchen
        - dispatcher
        - support
        - catalogue
        - finance
        - outlet
        - super_admin
    AdminRole:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: "#/components/schemas/ConsoleRole"
        permissions:
          type: array
          items:
            type: string
    AdminUserRoles:
      type: object
      required: [userId, roles]
      properties:
        userId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleRole"
    Allergen:
      type: string
      enum: [gluten, dairy, nuts, soy, egg, sesame, shellfish, other]
    ServingSize:
      type: object
      required: [label, grams]
      properties:
        label:
          type: string
          example: Regular
        grams:
          type: integer
          minimum: 1
    Money:
      type: object
      required: [amountPaise, currency]
      properties:
        amountPaise:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [INR]
    AvailabilityStatus:
      type: string
      enum: [available, low_stock, sold_out, unavailable]
    AvailabilityInfo:
      type: object
      required: [status, remaining]
      properties:
        status:
          $ref: "#/components/schemas/AvailabilityStatus"
        remaining:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
        nextBatchAt:
          type: string
          format: date-time
          nullable: true
        unavailableUntil:
          type: string
          format: date-time
          nullable: true
    ProductVariant:
      type: object
      required: [id, name, servingSize, price, availability]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        servingSize:
          $ref: "#/components/schemas/ServingSize"
        price:
          $ref: "#/components/schemas/Money"
        availability:
          $ref: "#/components/schemas/AvailabilityInfo"
    AddonOption:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        maxQuantity:
          type: integer
          minimum: 1
    AddonGroup:
      type: object
      required: [id, name, minSelect, maxSelect, options]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        minSelect:
          type: integer
          minimum: 0
        maxSelect:
          type: integer
          minimum: 1
        options:
          type: array
          items:
            $ref: "#/components/schemas/AddonOption"
    ComboComponent:
      type: object
      required: [productId, variantId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        stockSource:
          type: string
          enum: [component, combo_only]
          description: component decrements child stock once; combo_only uses combo batch
    ProductSummary:
      type: object
      required: [id, name, categoryId, published, availability, allergens]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        published:
          type: boolean
        isCombo:
          type: boolean
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        imageUrl:
          type: string
          nullable: true
        fromPrice:
          $ref: "#/components/schemas/Money"
        availability:
          $ref: "#/components/schemas/AvailabilityInfo"
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          required: [variants, addonGroups]
          properties:
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"
            addonGroups:
              type: array
              items:
                $ref: "#/components/schemas/AddonGroup"
            comboComponents:
              type: array
              items:
                $ref: "#/components/schemas/ComboComponent"
            taxCode:
              type: string
    ProductListResponse:
      type: object
      required: [outletId, products]
      properties:
        outletId:
          type: string
          format: uuid
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
    AvailabilitySnapshot:
      type: object
      required: [outletId, generatedAt, items]
      properties:
        outletId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        items:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AvailabilityInfo"
          description: Map keyed by variantId
    AdminProductUpsert:
      type: object
      required: [name, categoryId, variants]
      properties:
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        allergens:
          type: array
          items:
            $ref: "#/components/schemas/Allergen"
        isCombo:
          type: boolean
        taxCode:
          type: string
        imageUrl:
          type: string
        variants:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, servingSize, pricePaise]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              servingSize:
                $ref: "#/components/schemas/ServingSize"
              pricePaise:
                type: integer
                minimum: 0
        addonGroups:
          type: array
          items:
            $ref: "#/components/schemas/AddonGroup"
        comboComponents:
          type: array
          items:
            $ref: "#/components/schemas/ComboComponent"
    MarkUnavailableRequest:
      type: object
      required: [until]
      properties:
        variantId:
          type: string
          format: uuid
          description: Omit to mark all variants of the product
        until:
          type: string
          format: date-time
        reason:
          type: string
    BatchUpsert:
      type: object
      required: [outletId, variantId, serviceDate, portions]
      properties:
        outletId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        portions:
          type: integer
          minimum: 0
        wastage:
          type: integer
          minimum: 0
          default: 0
    Batch:
      type: object
      required: [id, outletId, variantId, serviceDate, portionsTotal, portionsRemaining, wastage]
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        portionsTotal:
          type: integer
        portionsRemaining:
          type: integer
        wastage:
          type: integer
    AddressLabel:
      type: string
      enum: [home, work, other]
    AddressUpsert:
      type: object
      required: [label, line1, lat, lng]
      properties:
        label:
          $ref: "#/components/schemas/AddressLabel"
        labelCustom:
          type: string
          description: Required when label=other
        line1:
          type: string
        line2:
          type: string
        landmark:
          type: string
        city:
          type: string
          default: Mira Road
        pincode:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        deliveryInstructions:
          type: string
    Address:
      allOf:
        - $ref: "#/components/schemas/AddressUpsert"
        - type: object
          required: [id, userId]
          properties:
            id:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            serviceable:
              type: boolean
            outletId:
              type: string
              format: uuid
              nullable: true
    ServiceabilityRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        addressId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [instant, scheduled]
          default: instant
      description: Provide lat+lng or addressId
    ServiceabilityResult:
      type: object
      required: [deliverable, outletId, deliveryFeePaise, minOrderPaise, etaMinutes]
      properties:
        deliverable:
          type: boolean
        outletId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [instant, scheduled]
        deliveryFeePaise:
          type: integer
          minimum: 0
        minOrderPaise:
          type: integer
          minimum: 0
        etaMinutes:
          type: integer
          minimum: 0
        codEnabled:
          type: boolean
          description: Always false for pilot unless Admin enables (flagged off)
        slotsPreview:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
    WaitlistRequest:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        phone:
          type: string
          pattern: '^\+91[6-9]\d{9}$'
        note:
          type: string
    Outlet:
      type: object
      required: [id, name, city, timezone, openTime, closeTime]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        timezone:
          type: string
          default: Asia/Kolkata
        openTime:
          type: string
          example: "11:00"
        closeTime:
          type: string
          example: "23:00"
        lat:
          type: number
        lng:
          type: number
        packagingFeePaise:
          type: integer
          minimum: 0
        defaultEtaMinutes:
          type: integer
    OutletUpsert:
      type: object
      properties:
        name:
          type: string
        openTime:
          type: string
        closeTime:
          type: string
        lat:
          type: number
        lng:
          type: number
        packagingFeePaise:
          type: integer
          minimum: 0
        defaultEtaMinutes:
          type: integer
    DeliveryZone:
      type: object
      required: [id, outletId, name, deliveryFeePaise, minOrderPaise, active]
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        name:
          type: string
        deliveryFeePaise:
          type: integer
          minimum: 0
        minOrderPaise:
          type: integer
          minimum: 0
        codEnabled:
          type: boolean
          default: false
        etaMinutes:
          type: integer
        radiusKm:
          type: number
          nullable: true
          description: When set, zone is circle around outlet lat/lng
        polygon:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng]
            properties:
              lat:
                type: number
              lng:
                type: number
          description: Ring of points when not using radius
        active:
          type: boolean
    DeliveryZoneUpsert:
      type: object
      required: [name, deliveryFeePaise, minOrderPaise]
      properties:
        name:
          type: string
        deliveryFeePaise:
          type: integer
          minimum: 0
        minOrderPaise:
          type: integer
          minimum: 0
        codEnabled:
          type: boolean
          default: false
        etaMinutes:
          type: integer
        radiusKm:
          type: number
          nullable: true
        polygon:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng]
            properties:
              lat:
                type: number
              lng:
                type: number
        active:
          type: boolean
          default: true
    Slot:
      type: object
      required: [id, outletId, startAt, endAt, cutoffAt, capacityTotal, capacityRemaining, full]
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        capacityTotal:
          type: integer
        capacityRemaining:
          type: integer
        full:
          type: boolean
    SlotListResponse:
      type: object
      required: [outletId, date, slots]
      properties:
        outletId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
    FeeLine:
      type: object
      required: [code, label, amountPaise]
      properties:
        code:
          type: string
          enum: [subtotal, packaging, delivery, tax, discount, tip, total]
        label:
          type: string
        amountPaise:
          type: integer
        note:
          type: string
    CartLineInput:
      type: object
      required: [productId, variantId, quantity, priceVersion]
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        priceVersion:
          type: integer
          minimum: 1
        addonOptionIds:
          type: array
          items:
            type: string
            format: uuid
        notes:
          type: string
    CartUpsert:
      type: object
      required: [outletId, lines]
      properties:
        outletId:
          type: string
          format: uuid
        addressId:
          type: string
          format: uuid
          nullable: true
        mode:
          type: string
          enum: [instant, scheduled]
          default: instant
        slotId:
          type: string
          format: uuid
          nullable: true
        couponCode:
          type: string
          nullable: true
        tipPaise:
          type: integer
          minimum: 0
          default: 0
        lines:
          type: array
          items:
